<style>

  body { overflow: hidden; }

  /* Palco 16:9 escalado para caber na janela */
  #palco { position: fixed; inset: 0; display: grid; place-items: center; }
  .slide { width: 1280px; height: 720px; background: var(--slide); border: 1px solid var(--line); box-shadow: var(--shadow);
    border-radius: 14px; padding: 60px 80px 52px; position: absolute; display: none; flex-direction: column;

  .slide.ativo { display: flex; animation: entra .35s ease; }
  @keyframes entra { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .slide.ativo { animation: none; } }

  .kicker { font-family: var(--mono); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  h1 { font-size: 44px; line-height: 1.12; margin: 0 0 26px; font-weight: 700; letter-spacing: -.01em; }

  .nota { margin-top: auto; padding-top: 16px; font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); }
  strong { color: var(--accent); font-weight: 700; }

  /* capa */

  .capa .selo { align-self: flex-start; font-family: var(--mono); font-size: 14px; letter-spacing: .12em; text-transform: uppercase;

  .capa h1 { font-size: 56px; max-width: 980px; }
  .capa .sub { font-size: 25px; color: var(--muted); max-width: 860px; line-height: 1.4; }
  .capa .autores { margin-top: 44px; font-size: 19px; line-height: 1.7; }
  .capa .rodape { position: absolute; bottom: 42px; left: 80px; font-family: var(--mono); font-size: 14px; color: var(--muted); }

  .coluna { background: var(--surface2); border-radius: 12px; padding: 24px 28px; }

  .coluna li { font-size: 20px; line-height: 1.4; }

  .grafico svg { width: 100%; height: auto; }
  .grafico svg text { fill: var(--ink); font-family: var(--mono); }
  .grafico ul { margin: 0; padding-left: 22px; display: grid; gap: 14px; }
  .grafico li { font-size: 21px; line-height: 1.4; }

  .legenda span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
  .legenda .a::before { background: var(--accent); }
  .legenda .b::before { background: var(--b); }

  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.35; }
  th { color: var(--muted); font-family: var(--mono); font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
  td:first-child { font-weight: 600; }

  /* barra de progresso e controles */
  #progresso { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width .3s; z-index: 5; }
  #contador { position: fixed; right: 18px; bottom: 12px; font-family: var(--mono); font-size: 13px; color: var(--muted); z-index: 5; }
  #controles { position: fixed; left: 14px; bottom: 10px; display: flex; gap: 6px; z-index: 5; opacity: .4; transition: opacity .2s; }

  #controles button, #controles a { background: var(--slide); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;

  /* visão geral */
  body.geral { overflow: auto; }
  body.geral #palco { position: static; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; padding: 24px; }
  body.geral .slide { display: flex; position: relative; transform: none; width: 100%; height: auto; aspect-ratio: 16 / 9; zoom: .25; cursor: pointer; animation: none; }

  @media print {
    @page { size: 1280px 720px; margin: 0; }

    #palco { position: static; display: block; }
    .slide { display: flex !important; position: relative; transform: none !important; box-shadow: none; border-radius: 0; page-break-after: always; animation: none; }
    #progresso, #contador, #controles { display: none; }
  }
</style>

    ],

  },
  {
    tipo: 'numeros',
    kicker: 'Resultados dos modelos',
    titulo: 'Os modelos superam os baselines, com cautela',
    numeros: [
      { valor: '0,110', rotulo: 'MAE da quebra · 2023', detalhe: 'Random Forest, contra 0,132 do baseline pela mediana (p = 0,004). R² ≈ 0: o processo estava estável.' },
      { valor: '0,163', rotulo: 'PR-AUC quebra baixa · 2021–22', detalhe: 'Regressão Logística, contra 0,074 da prevalência (p = 0,003). O modelo simples venceu os de árvores.' },
      { valor: '0,137', rotulo: 'PR-AUC com dados sintéticos', detalhe: 'Treinar no sintético e testar no real ficou abaixo do treino real (0,159).' },
    ],
    nota: 'Validação por grupo; nenhum ciclo ou dia aparece ao mesmo tempo no treino e no teste.',
  },
  {
    tipo: 'topicos',
    kicker: 'Contribuições',
    titulo: 'O que este trabalho entrega',
    itens: [

    ],
  },
  {
    tipo: 'topicos',
    kicker: 'Próximos passos',
    titulo: 'Para onde o trabalho vai',
    itens: [
      'Confirmar com a fábrica a causa da mudança de dez/2021 e a hipótese do Turno 1',
      'Explicações por período com **detecção automática de mudança**',

      'Artigo submetido ao **ICEIS 2027** (versões em inglês e português)',
    ],
    nota: 'Simulador, métricas e explicações interativas: higorlucas125.github.io/xai.github.io',

];

/* =====================================================================
   MOTOR DOS SLIDES — normalmente não precisa mexer daqui para baixo
   ===================================================================== */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const cabeca = (s) => `${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ''}<h1>${md(s.titulo)}</h1>`;
const nota = (s) => (s.nota ? `<div class="nota">${md(s.nota)}</div>` : '');
const num = (v, casas) => v.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });

function graficoBarras(s) {
  const W = 660, H = 380, mE = 64, mB = 34, mT = 30, n = s.rotulos.length, k = s.series.length;
  const todos = s.series.flatMap((x) => x.valores);
  const temNeg = todos.some((v) => v < 0);
  const max = Math.max(...todos.map(Math.abs)) * 1.18 || 1;
  const area = H - mB - mT;
  const y0 = temNeg ? mT + area / 2 : H - mB;
  const esc_ = temNeg ? (area / 2) / max : area / max;
  const passo = (W - mE) / n;
  const larg = (passo * 0.72) / k;
  let svg = `<text x="0" y="16" font-size="14" fill="var(--muted)">${esc(s.unidade || '')}</text>`;
  svg += `<line x1="${mE - 6}" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--line)" stroke-width="2"/>`;
  s.rotulos.forEach((r, i) => {
    const x0 = mE + i * passo + passo * 0.14;
    s.series.forEach((serie, j) => {
      const v = serie.valores[i];
      const h = Math.max(Math.abs(v) * esc_, 1);
      const x = x0 + j * larg;
      const y = v >= 0 ? y0 - h : y0;
      const cor = serie.cor === 'b' ? 'var(--b)' : 'var(--accent)';
      svg += `<rect x="${x}" y="${y}" width="${larg - 2}" height="${h}" rx="2" fill="${cor}"><title>${esc(serie.nome ? `${serie.nome} · ` : '')}${esc(r)}: ${num(v, s.casas ?? 1)}</title></rect>`;
      if (n * k <= 10) svg += `<text x="${x + (larg - 2) / 2}" y="${v >= 0 ? y - 7 : y + h + 16}" text-anchor="middle" font-size="14">${num(v, s.casas ?? 1)}</text>`;
    });
    svg += `<text x="${x0 + (passo * 0.72) / 2}" y="${H - 10}" text-anchor="middle" font-size="15">${esc(r)}</text>`;
  });
  const legenda = s.series.some((x) => x.nome)
    ? `<div class="legenda">${s.series.map((x) => `<span class="${x.cor === 'b' ? 'b' : 'a'}">${esc(x.nome)}</span>`).join('')}</div>` : '';
  return `<div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.titulo)}">${svg}</svg>${legenda}</div>`;
}

const RENDER = {
  capa: (s) => `${s.selo ? `<div class="selo">${esc(s.selo)}</div>` : ''}<h1>${md(s.titulo)}</h1><div class="sub">${md(s.subtitulo || '')}</div>
    <div class="autores">${(s.autores || []).map(esc).join('<br>')}</div><div class="rodape">${esc(s.rodape || '')}</div>`,
  texto: (s) => `${cabeca(s)}<div class="corpo texto${s.pendente ? ' pendente' : ''}">${s.paragrafos.map((p) => `<p>${md(p)}</p>`).join('')}
    ${s.itens ? `<ul class="disciplinas">${s.itens.map((i) => `<li>${md(i)}</li>`).join('')}</ul>` : ''}
    ${s.assinatura && !s.pendente ? `<div class="assinatura">${esc(s.assinatura)}</div>` : ''}</div>${nota(s)}`,
  topicos: (s) => `${cabeca(s)}<div class="corpo"><ul class="itens">${s.itens.map((i) => `<li>${md(i)}</li>`).join('')}</ul></div>${nota(s)}`,
  numeros: (s) => `${cabeca(s)}<div class="corpo"><div class="numeros">${s.numeros.map((n) =>
    `<div class="numero"><div class="v">${esc(n.valor)}</div><div class="r">${md(n.rotulo)}</div>${n.detalhe ? `<div class="d">${md(n.detalhe)}</div>` : ''}</div>`).join('')}</div></div>${nota(s)}`,
  fluxo: (s) => `${cabeca(s)}<div class="corpo"><div class="fluxo">${s.etapas.map((e, i) =>
    `<div class="etapa"><div class="n">${i + 1}</div><h3>${md(e.titulo)}</h3><p>${md(e.texto)}</p></div>`).join('')}</div></div>${nota(s)}`,
  colunas: (s) => `${cabeca(s)}<div class="corpo"><div class="colunas">${s.colunas.map((c) =>
    `<div class="coluna"><h2>${md(c.titulo)}</h2><ul>${c.itens.map((i) => `<li>${md(i)}</li>`).join('')}</ul></div>`).join('')}</div></div>${nota(s)}`,
  barras: (s) => `${cabeca(s)}<div class="corpo"><div class="grafico">${graficoBarras(s)}<ul>${(s.texto || []).map((t) => `<li>${md(t)}</li>`).join('')}</ul></div></div>${nota(s)}`,
  tabela: (s) => `${cabeca(s)}<div class="corpo"><table><thead><tr>${s.cabecalho.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${s.linhas.map((l) => `<tr>${l.map((c) => `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${nota(s)}`,
};

try { const t = localStorage.getItem('apresentacao-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* sem storage */ }

const palco = document.getElementById('palco');
palco.innerHTML = SLIDES.map((s, i) =>
  `<section class="slide ${s.tipo === 'capa' ? 'capa' : ''}" data-i="${i}" aria-roledescription="slide" aria-label="${i + 1} de ${SLIDES.length}">${(RENDER[s.tipo] || RENDER.topicos)(s)}</section>`).join('');
const els = [...palco.querySelectorAll('.slide')];
let atual = Math.min(Math.max(parseInt(location.hash.slice(1), 10) - 1 || 0, 0), els.length - 1);

function escalar() {
  const k = Math.min(window.innerWidth / 1320, window.innerHeight / 760);
  document.documentElement.style.setProperty('--escala', `scale(${k})`);
}
function mostrar(i) {
  atual = Math.min(Math.max(i, 0), els.length - 1);
  els.forEach((el, j) => el.classList.toggle('ativo', j === atual));
  document.getElementById('progresso').style.width = `${((atual + 1) / els.length) * 100}%`;
  document.getElementById('contador').textContent = `${atual + 1} / ${els.length}`;
  history.replaceState(null, '', `#${atual + 1}`);
}
function alternarGeral() { document.body.classList.toggle('geral'); }
function alternarTema() {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('apresentacao-tema', r.dataset.theme); } catch (e) { /* sem storage */ }
}
const telaCheia = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());

document.addEventListener('keydown', (e) => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); mostrar(atual + 1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); mostrar(atual - 1); }
  else if (e.key === 'Home') mostrar(0);
  else if (e.key === 'End') mostrar(els.length - 1);
  else if (e.key.toLowerCase() === 'f') telaCheia();
  else if (e.key.toLowerCase() === 't') alternarTema();
  else if (e.key.toLowerCase() === 'o' || e.key === 'Escape') alternarGeral();
});
palco.addEventListener('click', (e) => {
  const s = e.target.closest('.slide');
  if (document.body.classList.contains('geral') && s) { alternarGeral(); mostrar(+s.dataset.i); }
  else if (!document.body.classList.contains('geral')) mostrar(atual + 1);
});
document.getElementById('controles').addEventListener('click', (e) => {
  const a = e.target.dataset?.acao;
  if (!a) return;
  ({ anterior: () => mostrar(atual - 1), proximo: () => mostrar(atual + 1), geral: alternarGeral, tema: alternarTema, tela: telaCheia })[a]?.();
  e.stopPropagation();
});
let toque = null;
palco.addEventListener('touchstart', (e) => { toque = e.touches[0].clientX; }, { passive: true });
palco.addEventListener('touchend', (e) => {
  if (toque === null) return;
  const dx = e.changedTouches[0].clientX - toque;
  if (Math.abs(dx) > 40) mostrar(atual + (dx < 0 ? 1 : -1));
  toque = null;
});
window.addEventListener('resize', escalar);
escalar();
mostrar(atual);
</script>
</body>
